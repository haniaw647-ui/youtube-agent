<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ops{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f0e4;
      --bg-card: #fffdf7;
      --text: #2b2a22;
      --text-muted: #746f5c;
      --accent: #6b4530;
      --accent-dark: #4f3222;
      --accent-light: #ecdfd2;
      --border: #ded5bd;
      --error: #a34430;
      --success: #4f6b3a;
      --warn: #b5872a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      line-height: 1.5;
    }
    h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; color: var(--text); }
    h2 { font-size: 1.6rem; margin: 1.5rem 0 1rem; }
    a { color: var(--accent-dark); }
    nav {
      display: flex; justify-content: space-between; align-items: center;
      margin: 0 -1.5rem 2rem; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border);
      background: var(--accent-light);
    }
    nav > div:first-child { font-family: Georgia, serif; font-size: 1.1rem; }
    nav a { color: var(--text); text-decoration: none; margin-left: 1.25rem; font-size: 0.9rem; }
    nav a:hover { color: var(--accent-dark); }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; box-shadow: 0 1px 3px rgba(43,42,34,0.06); }
    .error { color: var(--error); }
    .warn { color: var(--warn); }
    .success { color: var(--success); }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; background: var(--bg-card); }
    th, td { text-align: left; padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; }
    button { padding: 0.5rem 1.1rem; cursor: pointer; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 0.95rem; }
    button:hover { background: var(--accent-dark); }
    input { padding: 0.5rem 0.6rem; margin-bottom: 0.6rem; width: 100%; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); font-size: 0.95rem; }
  </style>
</head>
<body>
  <nav>
    <div>Internal Ops — not tenant-visible</div>
    <div><a href="/admin/jobs">Jobs</a><a href="/admin/failures">Failures</a><a href="/admin/quota">Quota</a><a href="/admin/tenants">Tenants</a><a href="/admin/abuse">Abuse</a><a href="/admin/logout">Log out</a></div>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
