<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f0e4;
      --bg-card: #fffdf7;
      --text: #2b2a22;
      --text-muted: #746f5c;
      --accent: #5c6b3f;
      --accent-dark: #46512f;
      --accent-light: #e4e6d1;
      --border: #ded5bd;
      --error: #a34430;
      --success: #4f6b3a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
      line-height: 1.5;
    }
    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: normal;
      color: var(--text);
    }
    h2 { font-size: 1.7rem; margin: 1.5rem 0 1rem; }
    h3 { font-size: 1.2rem; margin: 0 0 0.5rem; }
    a { color: var(--accent-dark); }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 -1.5rem 2rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    nav > div:first-child {
      font-family: Georgia, serif;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }
    nav a {
      color: var(--text);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.92rem;
    }
    nav a:hover { color: var(--accent-dark); }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 1px 3px rgba(43, 42, 34, 0.06);
    }
    .error { color: var(--error); }
    .success { color: var(--success); }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; background: var(--bg-card); }
    th, td { text-align: left; padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .script-content {
      white-space: pre-wrap;
      background: var(--accent-light);
      padding: 1rem;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
    }
    button {
      padding: 0.5rem 1.1rem;
      margin-right: 0.5rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button:hover { background: var(--accent-dark); }
    input, select {
      padding: 0.5rem 0.6rem;
      margin-bottom: 0.6rem;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font-size: 0.95rem;
    }
    input::placeholder { color: var(--text-muted); }
  </style>
</head>
<body>
  <nav>
    <div>YouTube Automation Platform</div>
    <div><a href="/dashboard/channels">Channels</a><a href="/dashboard/jobs">Jobs</a><a href="/dashboard/analytics">Analytics</a><a href="/dashboard/approvals">Approvals</a><a href="/dashboard/api-keys">API Keys</a><a href="/dashboard/logout">Log out</a></div>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
