<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f4fc;
      --bg-card: #ffffff;
      --sidebar-bg: #ffffff;
      --text: #1e1b2e;
      --text-muted: #8b87a3;
      --accent: #7c3aed;
      --accent-2: #ec4899;
      --accent-soft: #f3e8ff;
      --border: #ece8f7;
      --error: #d6336c;
      --success: #16a34a;
      --shadow: 0 1px 3px rgba(76, 29, 149, 0.06);
    }
    :root[data-theme="dark"] {
      --bg: #14121f;
      --bg-card: #1f1b2e;
      --sidebar-bg: #1a1726;
      --text: #f1effb;
      --text-muted: #9c97b8;
      --accent: #a78bfa;
      --accent-2: #f472b6;
      --accent-soft: #2e2a45;
      --border: #2e2a45;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    h1, h2, h3 { font-weight: 600; color: var(--text); margin: 0 0 0.75rem; }
    h2 { font-size: 1.5rem; }
    h3 { font-size: 1.05rem; }

    .shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 230px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
    }
    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      padding: 0 0.75rem 1.5rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sidebar nav { display: flex; flex-direction: column; gap: 0.25rem; }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.75rem;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 500;
    }
    .sidebar nav a:hover { background: var(--accent-soft); color: var(--text); }
    .sidebar nav a.active {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
    }
    .sidebar .spacer { flex: 1; }
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--text);
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
    }

    .main { flex: 1; min-width: 0; padding: 2rem 2.5rem; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: var(--shadow);
    }
    .stat-card .stat-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; margin-bottom: 0.75rem;
    }
    .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; }
    .stat-card .stat-label { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.15rem; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
    }
    .error { color: var(--error); }
    .success { color: var(--success); }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; background: var(--bg-card); }
    th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; }
    .script-content {
      white-space: pre-wrap;
      background: var(--accent-soft);
      padding: 1rem;
      border-radius: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    button {
      padding: 0.55rem 1.2rem;
      margin-right: 0.5rem;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 500;
    }
    button:hover { opacity: 0.92; }
    input, select {
      padding: 0.55rem 0.7rem;
      margin-bottom: 0.6rem;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
    }
    input::placeholder { color: var(--text-muted); }

    @media (max-width: 800px) {
      .shell { flex-direction: column; }
      .sidebar { width: 100%; flex-direction: row; overflow-x: auto; align-items: center; }
      .sidebar nav { flex-direction: row; }
      .sidebar .spacer { display: none; }
      .brand { padding: 0 1rem 0 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="sidebar">
      <div class="brand">▲ AutoTube</div>
      <nav>
        <a href="/dashboard/overview" {% if active_nav == 'overview' %}class="active"{% endif %}>🏠 Overview</a>
        <a href="/dashboard/channels" {% if active_nav == 'channels' %}class="active"{% endif %}>📺 Channels</a>
        <a href="/dashboard/jobs" {% if active_nav == 'jobs' %}class="active"{% endif %}>🎬 Jobs</a>
        <a href="/dashboard/analytics" {% if active_nav == 'analytics' %}class="active"{% endif %}>📈 Analytics</a>
        <a href="/dashboard/approvals" {% if active_nav == 'approvals' %}class="active"{% endif %}>✅ Approvals</a>
        <a href="/dashboard/notifications" {% if active_nav == 'notifications' %}class="active"{% endif %}>🔔 Notifications</a>
        <a href="/dashboard/api-keys" {% if active_nav == 'api-keys' %}class="active"{% endif %}>🔑 API Keys</a>
        <a href="/dashboard/logout">🚪 Log out</a>
      </nav>
      <div class="spacer"></div>
      <button class="theme-toggle" onclick="toggleTheme()"><span id="theme-icon">🌙</span> <span id="theme-label">Dark mode</span></button>
    </div>
    <div class="main">
      {% block content %}{% endblock %}
    </div>
  </div>
  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('theme-icon').textContent = theme === 'dark' ? '☀️' : '🌙';
      document.getElementById('theme-label').textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('dashboard-theme', next);
      applyTheme(next);
    }
    (function () {
      const saved = localStorage.getItem('dashboard-theme');
      const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(theme);
    })();

    // Server renders timestamps in UTC (data-utc, no offset); browsers show
    // them in the viewer's own local timezone instead.
    function localizeTimes() {
      document.querySelectorAll('.local-time').forEach(function (el) {
        const iso = el.getAttribute('data-utc');
        if (!iso) return;
        const d = new Date(iso);
        if (isNaN(d.getTime())) return;
        const mode = el.getAttribute('data-mode') || 'datetime';
        if (mode === 'date') {
          el.textContent = d.toLocaleDateString();
        } else {
          el.textContent = d.toLocaleString(undefined, {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hour12: false,
          });
        }
      });
    }
    document.addEventListener('DOMContentLoaded', localizeTimes);
  </script>
</body>
</html>
