<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <style>
    body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    nav { display: flex; justify-content: space-between; margin-bottom: 2rem; border-bottom: 1px solid #ddd; padding-bottom: 1rem; }
    nav a { color: #1a1a1a; text-decoration: none; margin-right: 1rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; }
    .error { color: #b00020; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; }
    .script-content { white-space: pre-wrap; background: #f7f7f7; padding: 1rem; border-radius: 6px; max-height: 300px; overflow-y: auto; }
    button { padding: 0.4rem 1rem; margin-right: 0.5rem; cursor: pointer; }
    input { padding: 0.4rem; margin-bottom: 0.5rem; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <nav>
    <div><strong>YouTube Automation Platform</strong></div>
    <div><a href="/dashboard/channels">Channels</a><a href="/dashboard/jobs">Jobs</a><a href="/dashboard/approvals">Approvals</a><a href="/dashboard/api-keys">API Keys</a><a href="/dashboard/logout">Log out</a></div>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
