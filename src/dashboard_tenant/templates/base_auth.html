<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f4fc;
      --bg-card: #ffffff;
      --text: #1e1b2e;
      --text-muted: #8b87a3;
      --accent: #7c3aed;
      --accent-2: #ec4899;
      --accent-soft: #f3e8ff;
      --border: #ece8f7;
      --error: #d6336c;
      --success: #16a34a;
      --shadow: 0 8px 30px rgba(124, 58, 237, 0.12);
    }
    :root[data-theme="dark"] {
      --bg: #14121f;
      --bg-card: #1f1b2e;
      --text: #f1effb;
      --text-muted: #9c97b8;
      --accent: #a78bfa;
      --accent-2: #f472b6;
      --accent-soft: #2e2a45;
      --border: #2e2a45;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, var(--accent-soft), var(--bg) 60%);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.5;
    }
    .brand {
      position: fixed;
      top: 1.75rem;
      left: 2rem;
      font-weight: 700;
      font-size: 1.05rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 2.25rem;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 380px;
    }
    h2 { margin: 0 0 1.25rem; font-weight: 600; }
    a { color: var(--accent); text-decoration: none; }
    .error { color: var(--error); }
    .success { color: var(--success); }
    button {
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      width: 100%;
    }
    button:hover { opacity: 0.92; }
    input, select {
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.75rem;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
    }
    input::placeholder { color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="brand">▲ AutoTube</div>
  {% block content %}{% endblock %}
  <script>
    (function () {
      const saved = localStorage.getItem('dashboard-theme');
      const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</body>
</html>
