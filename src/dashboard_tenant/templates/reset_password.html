{% extends "base_auth.html" %}
{% block title %}Set a new password{% endblock %}
{% block content %}
<div class="card">
  <h2>Set a new password</h2>
  <p id="reset-error" class="error" style="display:none;"></p>
  <p id="reset-success" class="success" style="display:none;">
    Password updated. <a href="/dashboard/login">Log in</a>.
  </p>
  <form id="reset-form">
    <input type="password" id="new-password" placeholder="New password" required minlength="6">
    <input type="password" id="confirm-password" placeholder="Confirm new password" required minlength="6">
    <button type="submit">Set new password</button>
  </form>
</div>
<script>
(function () {
  // The recovery link's access_token lives in the URL fragment, which the
  // browser never sends to any server — so this has to talk to Supabase
  // directly rather than round-tripping through our own backend.
  var params = new URLSearchParams(window.location.hash.slice(1));
  var accessToken = params.get('access_token');
  var form = document.getElementById('reset-form');
  var errorEl = document.getElementById('reset-error');
  var successEl = document.getElementById('reset-success');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  if (!accessToken) {
    form.style.display = 'none';
    showError('This reset link is invalid or has expired. Request a new one from the login page.');
    return;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('new-password').value;
    var confirmPw = document.getElementById('confirm-password').value;
    if (pw !== confirmPw) {
      showError('Passwords do not match.');
      return;
    }
    errorEl.style.display = 'none';
    fetch("{{ supabase_url }}/auth/v1/user", {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'apikey': "{{ supabase_anon_key }}",
        'Authorization': 'Bearer ' + accessToken
      },
      body: JSON.stringify({ password: pw })
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.json().then(function (data) {
          throw new Error(data.msg || data.error_description || 'Could not update password.');
        });
      }
      form.style.display = 'none';
      successEl.style.display = 'block';
    }).catch(function (err) {
      showError(err.message);
    });
  });
})();
</script>
{% endblock %}
